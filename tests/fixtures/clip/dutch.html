<h1>Één winter aan zee</h1>
<p>Tweeëntwintig meeuwen zaten op de reling. Ze hadden geen ruzie, maar ze deelden ook niets.</p>
<p>’s Avonds liepen we over het strand naar de vuurtoren, en de lucht rook naar zout.</p>
