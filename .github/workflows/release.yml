name: release

# Push a tag like v1.0.0 to build the Windows app and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[app,build]"
      - run: python -m unittest discover tests
      - run: pyinstaller packaging/studio.spec --noconfirm
      - name: Check the build
        run: |
          dist\Studio\studio-cli.exe version
          python tests/e2e_mcp.py
      - name: Zip
        run: Compress-Archive -Path dist\Studio -DestinationPath Studio-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-windows-x64
          path: Studio-windows-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --title "Studio ${{ github.ref_name }}" --generate-notes }
          gh release upload "${{ github.ref_name }}" Studio-windows-x64.zip --clobber
